[hud]
; Native team cards are automatically replaced for 9+ survivors or repeated
; survivor character IDs. Player nicknames and model names are not triggers.
; 1: replace the complete teammate display when the active survivor set is L4D1.
; 0: keep normal additions unless another automatic replacement trigger applies.
replace_l4d1_team=1
; 0: current design. 1: read the currently loaded in-game HUD style.
theme=0
; Mirror three real teammates as extra cards in a standard four-player game.
single_player_test=0
; Enables the extra teammate HUD. The local player's HUD remains visible.
enabled=1
; 0: normally at most seven teammates. 1: all teammates that fit.
; The limit is not used while the complete teammate display is replaced.
show_overflow=0
debug_log=1
; New cards only: 85 percent of the detected stock card dimensions.
scale_percent=85
gap=6
row_gap=8
offset_x=0
offset_y=0
